services:

  employee-app:
    build:
      context: .
      dockerfile: python/Dockerfile

  manager-app:
    build:
      context: .
      dockerfile: expense-app-managers/Dockerfile

  api-tests:
    build:
      context: .
      dockerfile: expense-app-managers/Dockerfile.test
    environment:
      EMPLOYEE_API_URL: http://employee-app:5000
      MANAGER_API_URL: http://manager-app:5001
    depends_on:
      - employee-app
      - manager-app

  selenium:
    image: selenium/standalone-chrome
    ports:
      - "4444:4444"
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4444/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      SELENIUM_URL: http://selenium:4444/wd/hub
      APP_URL: http://employee-app:5000/app
    depends_on:
      - employee-app
      - selenium