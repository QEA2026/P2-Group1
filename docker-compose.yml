services:

  employee-app:
    build:
      context: .
      dockerfile: python/Dockerfile
    environment:
      EXPENSE_DB_PATH: /var/lib/expense-data/revExpenseData.db
    # volumes:
    #   - vol-expense-database:/var/lib/expense-data

  employee-app-test:
    build:
      context: .
      dockerfile: python/Dockerfile.test-server
    environment:
      EXPENSE_DB_PATH: /var/lib/expense-data/testDatabase.db
    volumes:
      - vol-test-database:/var/lib/expense-data

  manager-app:
    build:
      context: .
      dockerfile: expense-app-managers/Dockerfile
    environment:
      DATABASE_PATH: /var/lib/expense-data/revExpenseData.db
    # volumes:
    #   - vol-expense-database:/var/lib/expense-data

  manager-app-test:
    build:
      context: .
      dockerfile: expense-app-managers/Dockerfile.test-server
    environment:
      DATABASE_PATH: /var/lib/expense-data/testDatabase.db
    volumes:
      - vol-test-database:/var/lib/expense-data

  api-tests:
    build:
      context: .
      dockerfile: expense-app-managers/Dockerfile.test
    environment:
      EMPLOYEE_API_URL: http://employee-app-test:5000
      MANAGER_API_URL: http://manager-app-test:5001
      DATABASE_PATH: /var/lib/expense-data/testDatabase.db
    volumes:
      - vol-test-database:/var/lib/expense-data
    depends_on:
      - employee-app-test
      - manager-app-test

  selenium:
    image: selenium/standalone-chrome
    ports:
      - "4444:4444"
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4444/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      SELENIUM_URL: http://selenium:4444/wd/hub
      APP_URL: http://employee-app:5000/app
    depends_on:
      - employee-app
      - selenium

volumes:
  vol-expense-database:
    external: true

  vol-test-database:
    external: true